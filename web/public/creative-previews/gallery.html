<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>پیش‌نمایش کامپوننت‌های EditorGPT</title>
<style>body{font:16px/1.8 system-ui;background:#151515;color:#eee;margin:0;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 32px}main{max-width:1200px;margin:auto}input{font:inherit;padding:12px;border:1px solid #555;border-radius:12px;background:#222;color:inherit;box-sizing:border-box;width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:24px}article{border:1px solid #444;border-radius:16px;overflow:hidden;background:#202020}article img{display:block;width:100%;height:350px;object-fit:contain;background:#111}article section{padding:16px}h2{font-size:18px;overflow-wrap:anywhere}small{color:#bbb}summary{cursor:pointer}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;direction:ltr;text-align:left}a{color:#9fc8ff}</style></head>
<body><main><h1>پیش‌نمایش کامپوننت‌ها</h1><p>تصاویر از اجرای کد اصلی ساخته شده‌اند. این‌ها نمونهٔ نمایشی‌اند، نه ویدیوی پروژهٔ شما. «بررسی مرورگر» به معنی تأیید همهٔ ورودی‌ها و فرمت‌ها نیست.</p><label>جستجو<input id="search" type="search" placeholder="نام کامپوننت…"></label><p id="status" role="status">در حال خواندن گالری…</p><div id="gallery" class="grid"></div></main>
<script>
let items=[];const gallery=document.querySelector('#gallery'),status=document.querySelector('#status');
const normalized=value=>value.toLowerCase().replaceAll('ي','ی').replaceAll('ك','ک');
const versioned=(url,hash)=>url+(/^[0-9a-f]{64}$/.test(hash||'')?'?v='+hash.slice(0,16):'');
function draw(){gallery.replaceChildren();const query=normalized(document.querySelector('#search').value);const shown=items.filter(x=>normalized([x.name,x.id,x.description||'',x.use||''].join(' ')).includes(query));status.textContent=shown.length+' نمونه؛ وضعیت هر مورد جداگانه نمایش داده می‌شود.';
for(const item of shown){
const card=document.createElement('article');
if(item.poster&&/^\/creative-previews\/[a-z0-9-]+\.png$/.test(item.poster)){
const image=document.createElement('img');image.src=versioned(item.poster,item.poster_sha256);image.loading='lazy';image.alt='نمونهٔ اجرای '+item.name;const link=document.createElement('a');link.href=image.src;link.target='_blank';link.rel='noopener';link.setAttribute('aria-label','نمایش تصویر کامل '+item.name);link.append(image);card.append(link);}
const section=document.createElement('section'),title=document.createElement('h2');title.dir='ltr';title.textContent=item.name;section.append(title);
const state=document.createElement('p');
state.textContent=item.status==='native-component-checked'?'کامپوننت پارامتریک · خروجی واقعی و اتصال ترکیبی بررسی شد':item.status==='browser-checked'?'بررسی مرورگر انجام شد · عمودی':item.status==='synthetic-frame-checked'?'اجرای افکت روی ورودی هندسی · رهگیری چهره و ویدیوی کامل آزمون نشده':item.status==='upstream-demo-checked'?'اجرای مستقیم نمونهٔ اصلی · اتصال محتوای کاربر و فارسی/عمودی هنوز تکمیل نشده':'نیازمند اصلاح؛ آمادهٔ انتخاب موتور نیست';
section.append(state);
if(item.use){const use=document.createElement('p');use.textContent=item.use;section.append(use);}
if(item.preview_video&&/^\/creative-previews\/[a-z0-9-]+\.mp4$/.test(item.preview_video)){
 const play=document.createElement('button');play.type='button';play.textContent='پخش نمونهٔ حرکت';play.style.cssText='font:inherit;background:#333;color:#eee;border:1px solid #666;border-radius:10px;padding:8px 16px;cursor:pointer';
 play.addEventListener('click',()=>{const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='none';video.style.width='100%';video.setAttribute('aria-label','نمونهٔ حرکت '+item.name);video.src=versioned(item.preview_video,item.video_sha256);play.replaceWith(video);video.play().catch(()=>{});},{once:true});section.append(play);
}
const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='ورودی‌ها و اطلاعات فنی';
pre.textContent=JSON.stringify({resource_id:item.id,status:item.status,fixture:item.fixture,tracking_verified:item.tracking_verified,production_template_ready:item.production_template_ready,source_revision:item.source_revision,backward_seek_verified:item.backward_seek_verified,parameters:item.parameters,source_sha256:item.source_sha256,source_adapter_sha256:item.source_adapter_sha256,encoded_output_verified:item.encoded_output_verified,hybrid_browser_checked:item.hybrid_browser_checked,frame_audit:item.frame_audit,card_region_audit:item.card_region_audit,hybrid_opening_audit:item.hybrid_opening_audit,media:item.media,findings:item.findings},null,2);
details.append(summary,pre);section.append(details);card.append(section);gallery.append(card);
}}
document.querySelector('#search').addEventListener('input',draw);Promise.all(['index.json','claude-effects.json','shotcraft.json','lemo.json','native-shotcraft.json'].map(file=>fetch('./'+file,{cache:'no-store'}).then(r=>r.ok?r.json():{items:{}}).catch(()=>({items:{}})))).then(groups=>{items=groups.flatMap(data=>Object.values(data.items));draw()}).catch(()=>{status.textContent='گالری هنوز ساخته نشده یا قابل دسترسی نیست.'});
</script></body></html>
